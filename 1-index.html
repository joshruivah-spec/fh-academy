const C=[{"name": "Salon Intensive Cut & Colour", "expl": "A focused programme for working hairdressers who want to sharpen cutting and colouring in one stretch. You build precise, repeatable cutting methods and a solid grasp of colour, then practise them on models every day so the skills carry straight back to the salon floor.", "note": "Aimed at hairdressers who want the skills to excel in a competitive salon.", "taught": ["Precision cutting and colouring techniques", "Creative cutting sessions: disconnection, freehand and modern sectioning patterns", "Colour chart theory", "Total, partial and combination colour techniques", "Demonstrations plus daily hands-on work sessions"], "datelab": "DATES 2027", "dates": "", "req": "For qualified or experienced hairdressers. [FH to confirm]"}, {"name": "Barbering", "expl": "A practical course in modern barbering that gives short hair, fades and finishing the same care as long hair. Students learn to blend with clippers and scissors, shape for each client's head and hair type, and finish with a clean, confident style.", "note": "In-person, hands-on training with expert guidance.", "taught": ["Inclusive, gender-neutral barbering for all hair types", "Precision cutting", "Fading with scissors and clippers together", "Advanced styling techniques", "Classic barbering principles, suitability, control and finish"], "datelab": "DATES 2027", "dates": "", "req": "Designed for all experience levels; for hairdressers and barbers."}, {"name": "Express Colour", "expl": "A short, fast course on colour that works in a busy salon. You learn quick highlighting and balayage methods that give natural depth and a soft blend without long appointments, so a great result fits inside a tight booking.", "note": "Aimed at hair professionals expanding their skill set.", "taught": ["Highlighting and modern balayage techniques", "Precision foil placement for rapid highlighting", "Seamless balayage blending", "Dimensional, multi-tonal effects done quickly", "Techniques for a fast-paced salon"], "datelab": "DATES 2027", "dates": "Dates to be confirmed", "req": "[FH to confirm]"}, {"name": "Collection", "expl": "A look at the Academy's newest work. The creative team presents the season's cut and colour ideas on models, explains the thinking behind them, and guides students through trying the techniques, with room to ask questions throughout.", "note": "A first look at new developments in cutting and colouring.", "taught": ["The latest collection, presented by the creative team", "Model presentations and lectures", "Guided work sessions and demonstrations", "Both cut and colour", "Interactive: students ask questions of the team"], "datelab": "DATES 2027", "dates": "", "req": "For advanced learners. [FH to confirm]"}, {"name": "Photographic / Editorial With Florian Hurel", "expl": "Learn how hair is created for the camera. You see how a look is planned and styled for a shoot, how to work with a team on set, and how salon skills adapt to images. You finish with a photograph of your own work.", "note": "Led by: [FH to confirm]", "taught": ["Image creation and the editorial process", "Salon-to-session versatility", "Backstage secrets of camera-ready hair", "Practical styling combined with image-making", "Ends with your own editorial photograph"], "datelab": "DATES 2027", "dates": "Dates to be confirmed", "req": "[FH to confirm]"}, {"name": "Texture", "expl": "A course on working confidently with wavy and curly hair. You learn how texture changes cutting, balance and shape, and practise techniques that respect natural movement while still giving clean, flattering results.", "note": "", "taught": ["Mastery of textured hair", "Modern ways of working with naturally wavy and curly hair", "Precision techniques combined with collection techniques", "Modern balances and proportions", "Hands-on practical sessions and detailed tutorials"], "datelab": "DATES 2027", "dates": "Dates to be confirmed", "req": "[FH to confirm]"}, {"name": "1-on-1 Tuition", "expl": "Private teaching built around you. Together with the education team you set your own goals, then work model by model with feedback straight away, and take home notes, sketches and photos to keep practising.", "note": "Contact: [FH to add]", "taught": ["Personalised programme for goals beyond the standard courses", "Immediate feedback after every model", "Before and after photos, notes, drawings and diagrams", "Designed one-to-one with the education team"], "datelab": "DATES 2027", "dates": "By arrangement", "req": "None stated. Contact the Academy to design a programme."}];
const COV={"eb": "COURSE REFERENCE", "title": "FLORIAN HUREL HAIR ACADEMY 2027", "sub": "7 COURSES PLANNED FOR 2027", "note": "Working draft for editing. Gaps are marked in [brackets]. Prices are left blank to fill in."};
const OV={"eb": "FIND YOUR COURSE", "head": "Courses at a glance", "foot": "COURSES AT A GLANCE", "rows": [["COURSE", "DURATION", "PRICE"], ["Salon Intensive Cut & Colour", "3 days", ""], ["Barbering", "3 days", ""], ["Express Colour", "3 days", ""], ["Collection", "3 days", ""], ["Photographic / Editorial With Florian Hurel", "3 days", ""], ["Texture", "3 days", ""], ["1-on-1 Tuition", "3 days", ""]]};
const GH=["BEFORE WE PUBLISH", "Gaps to confirm"];
const GAPS=["Entry requirements are not confirmed per course. Most courses are expected to need a Level 2 hairdressing qualification or equivalent. [FH to confirm]", "Dates shown are indicative and may change. [FH to set final dates]", "Prices are intentionally blank, to be set by the Academy."];
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const bg=n=>'style="background-image:url('+PH[n]+')"';
const pages=[];
pages.push('<div class="page cover"><div class="txt"><p class="eb">'+e(COV.eb)+'</p><h1 class="cv">'+e(COV.title)+'</h1><p class="sub">'+e(COV.sub)+'</p><p class="small">'+e(COV.note)+'</p><img class="logo" alt="Florian Hurel Hair Couture & Spa Academy" src="'+PH.logo+'"></div><div class="ph" '+bg('cover')+'></div></div>');

pages.push('<div class="page" style="grid-template-columns:1fr"><div class="txt"><p class="eb">'+e(GH[0])+'</p><h2 class="t">'+e(GH[1])+'</h2><ul style="margin-top:4%">'+GAPS.map(g=>'<li style="margin-bottom:3%">'+e(g)+'</li>').join('')+'</ul></div></div>');
let page=0,busy=false,audio=null;
const slot=document.getElementById('slot'),wrap=document.getElementById('wrap'),cnt=document.getElementById('cnt'),pb=document.getElementById('prev'),nb=document.getElementById('next');
function show(){slot.innerHTML=pages[page];cnt.textContent=(page+1)+' / '+pages.length;pb.disabled=page===0;nb.disabled=page===pages.length-1;}
function sound(){try{if(!audio)audio=new Audio(SND);audio.currentTime=0;audio.play().catch(()=>{});}catch(x){}}
function turn(d){if(busy)return;const t=d==='next'?page+1:page-1;if(t<0||t>=pages.length)return;busy=true;sound();
 slot.innerHTML=pages[d==='next'?t:page];
 const sh=document.createElement('div');sh.className='sheet';sh.style.transform=d==='next'?'rotateY(0deg)':'rotateY(-180deg)';
 sh.innerHTML='<div class="face">'+pages[page]+'</div><div class="face back">'+pages[t]+'</div>';wrap.appendChild(sh);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.style.transform=d==='next'?'rotateY(-180deg)':'rotateY(0deg)';}));
 let done=false;const fin=()=>{if(done)return;done=true;page=t;wrap.innerHTML='';busy=false;show();};
 sh.addEventListener('transitionend',fin);setTimeout(fin,1200);}
pb.onclick=()=>turn('prev');nb.onclick=()=>turn('next');
let tx=null;const st=document.getElementById('book');
st.addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX},{passive:true});
st.addEventListener('touchend',ev=>{if(tx===null)return;const d=ev.changedTouches[0].clientX-tx;tx=null;if(d<-40)turn('next');else if(d>40)turn('prev');});
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')turn('next');if(ev.key==='ArrowLeft')turn('prev');});
page=+(location.hash.slice(1)||0);show();
</script></body></html>
